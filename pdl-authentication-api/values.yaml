replicaCount: 1

image:
  repository: ghcr.io/paisalo-digital-limited/pdl-authentication-api
  pullPolicy: IfNotPresent
  digest: "sha256:dc7b867f572fde3013ef37d399e09fb14af9eeeb8bedcca6deb56af94662252c"
  tag: ""

imagePullSecrets:
  - name: nbfc-ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

containerPort: 8080

env:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: "http://+:8080"
  # Container clock and DateTime.Now use India Standard Time. JWT exp is still validated in UTC.
  TZ: "Asia/Kolkata"
  DB_TimeZone: "Asia/Kolkata"
  isliveDb: "true"
  isLiveSession: "true"
  isCredlive: "true"
  # Public IP 34.131.181.133 times out from GKE. pdlerp_prod is on Cloud SQL instance "nbfc"; use its private IP.
  Credntials__HostIp: "10.247.161.3"
  Credntials__Port: "5432"
  Credntials__dbName: "pdlerp_prod"
  Credntials__username: "paisalo_developer"
  Credntials__password: "PaisaloDeveloper2026!"
  # Production SFTP. The API reads the port from configuration key "port".
  SftpHost: "124.123.16.234"
  SftpUsername: "Sftp"
  SftpPassword: "Sft@43^fw"
  port: "1024"
  remoteDir: "Data/Media/MenuDocs"
  # Enable Swagger UI behind Kong (https://api.paisalo.net/authentication/swagger/index.html)
  Swagger__Enabled: "true"
  # Prefix used by Swagger "Try it out" so calls hit Kong route /authentication/...
  Swagger__ServerPrefix: "/authentication"

extraEnv: []

envFrom: []
  # - secretRef:
  #     name: pdl-authentication-api-secrets

dataProtection:
  enabled: true
  # Non-root container user is app ($APP_UID); keys must live under /home/app, not /root.
  mountPath: /home/app/.aspnet/DataProtection-Keys

ingress:
  enabled: false
  className: "gce"
  annotations:
    kubernetes.io/ingress.class: "gce"
    # networking.gke.io/managed-certificates: "pdl-authentication-api-cert"
    # kubernetes.io/ingress.global-static-ip-name: "pdl-authentication-api-ip"
  hosts:
    - host: auth-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

# Liveness/startup: process only (/health/live).
startupProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}