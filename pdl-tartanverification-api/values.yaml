replicaCount: 1

image:
  repository: ghcr.io/paisalo-digital-limited/pdl-tartanverification-api
  pullPolicy: IfNotPresent
  digest: "sha256:370057d91c57338bb98db9ccc37556a0ea906a87406ba0efc66e5d076a36ef90"
  tag: ""

imagePullSecrets:
  - name: nbfc-ghcr-secret

nameOverride: ""
# Must match Kong upstream: pdl-tartanverification-api.erp-services.svc.cluster.local
fullnameOverride: "pdl-tartanverification-api"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

containerPort: 8080

env:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: "http://+:8080"
  # Override on-prem IP baked into appsettings.json — must be reachable from GKE (via VPN/Interconnect)
  DB_IP: "192.168.1.55"
  # Enable Swagger UI behind Kong (https://api.paisalo.net/tartanverification/swagger)
  Swagger__Enabled: "true"
  # Prefix used by Swagger "Try it out" so calls hit Kong route /tartanverification/...
  Swagger__ServerPrefix: "/tartanverification"

extraEnv: []

envFrom: []
  # - secretRef:
  #     name: pdl-tartanverification-api-secrets

dataProtection:
  enabled: true
  mountPath: /root/.aspnet/DataProtection-Keys

ingress:
  enabled: false
  className: "gce"
  annotations:
    kubernetes.io/ingress.class: "gce"
    # networking.gke.io/managed-certificates: "pdl-tartanverification-api-cert"
    # kubernetes.io/ingress.global-static-ip-name: "pdl-tartanverification-api-ip"
  hosts:
    - host: tartanverification-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# App exposes a single aggregate check at /health
startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
