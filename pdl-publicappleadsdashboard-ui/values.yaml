replicaCount: 1

image:
  repository: ghcr.io/paisalo-digital-limited/pdl-publicappleadsdashboard-ui
  pullPolicy: IfNotPresent
  digest: "sha256:b869633709b28b56b6e4a97b1b0fe947866b8bff420ab66f1a42ec05a99598ee"
  tag: ""

imagePullSecrets:
  - name: nbfc-ghcr-secret

nameOverride: ""
# Kong upstream: pdl-publicappleadsdashboard-ui.prod-erp-ui.svc.cluster.local
fullnameOverride: "pdl-publicappleadsdashboard-ui"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels:
  tier: frontend

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  # Kong egress allows prod-erp-ui:3000 only; GKE NP checks port AFTER DNAT,
  # so container must also listen on 3000 (same pattern as react-erp-ui).
  port: 3000

containerPort: 3000

# Keep for local-style nginx template; Kong routes /api and /swagger separately in prod.
env:
  API_UPSTREAM: "pdl-publicappleadsdashboard-service.prod-erp-services.svc.cluster.local:8080"
  NGINX_ENVSUBST_FILTER: "API_UPSTREAM"

extraEnv: []

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

startupProbe:
  httpGet:
    path: /leadsdashboard/
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 12

livenessProbe:
  httpGet:
    path: /leadsdashboard/
    port: http
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /leadsdashboard/
    port: http
  periodSeconds: 10
  failureThreshold: 3

# API/Swagger are separate Kong routes (not proxied by this UI).

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
