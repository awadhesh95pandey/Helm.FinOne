replicaCount: 1

image:
  repository: ghcr.io/paisalo-digital-limited/pdl-rcpostingfirst-api
  pullPolicy: IfNotPresent
  digest: "sha256:da5df786a8e384b0b9fe4f120332524ae72630cadfee0fe9d00ded1f66b463f7"
  tag: ""

imagePullSecrets:
  - name: nbfc-ghcr-secret

nameOverride: ""
# Must match Kong upstream: pdl-rcpostingfirst-api.erp-services.svc.cluster.local
fullnameOverride: "pdl-rcpostingfirst-api"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

containerPort: 8080

env:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: "http://+:8080"
  # Override on-prem IP baked into appsettings.json — must be reachable from GKE (via VPN/Interconnect)
  DB_IP: "192.168.1.55"
  isliveDb: "true"

  # SFTP Configuration
  SftpUsername: "Sftp"
  SftpPassword: "Sft@43^fw"
  SftpHost: "124.123.16.234"
  port: 1024
  BasePath: "https://predemoapi.paisalo.in:2383"

  #DB Configuration
  Postgres__Host: "34.131.181.133"
  Postgres__Port: 5432
  Postgres__Database: "pdlerp_prod"
  Postgres__Username: "paisalo_developer"
  Postgres__Password: "PaisaloDeveloper2026!"

  # GitHub placeholder used by other_pod health check — override with a real peer URL when available
  PodUrl: "https://github.com/Paisalo-Digital-Limited"
  # Enable Swagger UI behind Kong (https://api.paisalo.net/rcpostingfirst/swagger)
  Swagger__Enabled: "true"
  # Prefix used by Swagger "Try it out" so calls hit Kong route /rcpostingfirst/...
  Swagger__ServerPrefix: "/rcpostingfirst"

extraEnv: []

envFrom: []
  # - secretRef:
  #     name: pdl-rcpostingfirst-api-secrets

dataProtection:
  enabled: true
  mountPath: /root/.aspnet/DataProtection-Keys

ingress:
  enabled: false
  className: "gce"
  annotations:
    kubernetes.io/ingress.class: "gce"
    # networking.gke.io/managed-certificates: "pdl-rcpostingfirst-api-cert"
    # kubernetes.io/ingress.global-static-ip-name: "pdl-rcpostingfirst-api-ip"
  hosts:
    - host: rcpostingfirst-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# App exposes a single aggregate check at /health (SQL + other pod)
startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
