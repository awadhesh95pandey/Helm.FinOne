replicaCount: 1

image:
  repository: ghcr.io/paisalo-digital-limited/pdl-rcpostingfirst-api
  pullPolicy: IfNotPresent
  digest: "sha256:4fcbe844daa9d400edcd890d776ecf87bc7458cf7b42c5213ce751a5711669e3"
  tag: ""

imagePullSecrets:
  - name: nbfc-ghcr-secret

nameOverride: ""
# Must match Kong upstream: pdl-rcpostingfirst-api.erp-services.svc.cluster.local
fullnameOverride: "pdl-rcpostingfirst-api"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

containerPort: 8080

env:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: "http://+:8080"
  
  isliveDb: "true"

  # SFTP Configuration
  SftpUsername: "Sftp"
  SftpPassword: "Sft@43^fw"
  SftpHost: "124.123.16.234"
  port: 1024
  BasePath: "https://predemoapi.paisalo.in:2383"

  # Public IP 34.131.181.133 times out from GKE. The API reads Credntials__*, not Postgres__*.
  DB_TimeZone: "Asia/Kolkata"
  Credntials__HostIp: "10.247.161.3"
  Credntials__Port: "5432"
  Credntials__dbName: "pdlerp_prod"
  Credntials__username: "paisalo_production"
  Credntials__password: "PaisaloProduction2026#!"

  # GitHub placeholder used by other_pod health check — override with a real peer URL when available
  PodUrl: "https://github.com/Paisalo-Digital-Limited"
  # Enable Swagger UI behind Kong (https://api.paisalo.net/rcpostingfirst/swagger)
  Swagger__Enabled: "true"
  Swagger__ServerPrefix: "/rcpostingfirst"

extraEnv: []

envFrom: []
  # - secretRef:
  #     name: pdl-rcpostingfirst-api-secrets

dataProtection:
  enabled: true
  mountPath: /root/.aspnet/DataProtection-Keys

ingress:
  enabled: false
  className: "gce"
  annotations:
    kubernetes.io/ingress.class: "gce"
    # networking.gke.io/managed-certificates: "pdl-rcpostingfirst-api-cert"
    # kubernetes.io/ingress.global-static-ip-name: "pdl-rcpostingfirst-api-ip"
  hosts:
    - host: rcpostingfirst-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# App exposes a single aggregate check at /health (SQL + other pod)
startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
