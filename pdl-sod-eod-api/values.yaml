replicaCount: 1

image:
  repository: ghcr.io/paisalo-digital-limited/pdl-sod-eod-api
  pullPolicy: IfNotPresent
  digest: "sha256:4a95955f8f53b66d5fde0e5e6846621ea927509e06fb38cadcb8fe809598e65d"
  tag: ""

imagePullSecrets:
  - name: nbfc-ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

containerPort: 8080

env:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: "http://+:8080"

  # Container clock and DateTime.Now use India Standard Time. JWT exp is still validated in UTC.
  TZ: "Asia/Kolkata"
  DB_TimeZone: "Asia/Kolkata"
  isliveDb: "true"

  # Public IP 34.131.181.133 times out from GKE. pdlerp_prod is on Cloud SQL instance "nbfc"; use its private IP.
  Credntials__HostIp: "10.247.161.3"
  Credntials__Port: "5432"
  Credntials__dbName: "pdlerp_prod"
  DB_User: "paisalo_production"
  DB_Password: "PaisaloProduction2026#!"

  # Production SFTP. Uploads use these keys. RemotePath stays Data/RCSlip from appsettings.
  SftpHost: "124.123.16.234"
  SftpUsername: "Sftp"
  SftpPassword: "Sft@43^fw"
  port: "1024"

  # Enable Swagger UI behind Kong (https://api.paisalo.net/sodeod/swagger/index.html)
  Swagger__Enabled: "true"
  Swagger__ServerPrefix: "/sodeod"

extraEnv: []

envFrom: []
  # - secretRef:
  #     name: pdl-sod-eod-api-secrets

dataProtection:
  enabled: true
  mountPath: /root/.aspnet/DataProtection-Keys

ingress:
  enabled: false
  className: "gce"
  annotations:
    kubernetes.io/ingress.class: "gce"
    # networking.gke.io/managed-certificates: "pdl-sod-eod-api-cert"
    # kubernetes.io/ingress.global-static-ip-name: "pdl-sod-eod-api-ip"
  hosts:
    - host: sod-eod-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Liveness and startup only prove the process is listening.
# Readiness opens PostgreSQL and runs SELECT 1. Keep this timeout above the 8s connection timeout.
startupProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
