apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "pdl-headlendingvisitreportapi-api.fullname" . }}-test-connection"
  labels:
    {{- include "pdl-headlendingvisitreportapi-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: busybox
      image: busybox
      command: ["sh", "-c"]
      args:
        - "nc -z {{ include "pdl-headlendingvisitreportapi-api.fullname" . }} {{ .Values.service.port }}"
  restartPolicy: Never
