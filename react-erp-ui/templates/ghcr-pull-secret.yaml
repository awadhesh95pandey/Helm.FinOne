{{- if and .Values.ghcrPullSecret.create .Values.ghcrPullSecret.username .Values.ghcrPullSecret.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ghcrPullSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "react-erp-ui.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ include "react-erp-ui.ghcrDockerConfigJson" . }}
{{- end }}
