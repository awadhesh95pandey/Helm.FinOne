replicaCount: 1

image:
  repository: ghcr.io/paisalo-digital-limited/react-erp-ui-2025
  pullPolicy: Always
  digest: "sha256:3a17085e8d756ae5c7586b8ad350f5cdf33338a7572590ee1801f5e7742008d9"
  tag: ""

imagePullSecrets:
  - name: nbfc-ghcr-secret

ghcrPullSecret:
  create: false
  name: nbfc-ghcr-secret
  registry: ghcr.io
  username: ""
  password: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels:
  tier: frontend

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 3000

containerPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: erp.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - erp.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi

startupProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 12

livenessProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 10
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

extraEnv: []

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}