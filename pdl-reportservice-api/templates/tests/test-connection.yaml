apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "pdl-reportservice-api.fullname" . }}-test-connection"
  labels:
    {{- include "pdl-reportservice-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ["wget"]
      args:
        - "-qO-"
        - "http://{{ include "pdl-reportservice-api.fullname" . }}:{{ .Values.service.port }}/health"
  restartPolicy: Never
