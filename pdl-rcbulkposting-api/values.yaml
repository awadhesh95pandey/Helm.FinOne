replicaCount: 1

image:
  repository: ghcr.io/paisalo-digital-limited/pdl-rcbulkposting-api
  pullPolicy: IfNotPresent
  digest: "sha256:37aa048fa15822c513d873249cea7ee8c81950073df8208de24ec78875baa556"
  tag: ""

imagePullSecrets:
  - name: nbfc-ghcr-secret

nameOverride: ""
# Must match Kong upstream: pdl-rcbulkposting-api.prod-erp-services.svc.cluster.local
fullnameOverride: "pdl-rcbulkposting-api"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

containerPort: 8080

env:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: "http://+:8080"

  # Container clock and DateTime.Now use India Standard Time. The hosted job logs and delays in local time.
  TZ: "Asia/Kolkata"

  ConnectionStrings__DefaultConnection: "Host=10.247.161.3;Port=5432;Database=pdlerp_prod;Username=paisalo_production;Password=PaisaloProduction2026#!;SSL Mode=Require;Timezone=Asia/Kolkata"
  smsUrl: "https://finone.paisalo.in/authentication/api/SMS/SendSMS"
  
  # Authentication__ApiKey: "PAISALODIGITAL_API_2026_CLOUD_DEPLOYEMENT#!"
  # Swagger stays off in Production unless this is set. Kong strips /rcbulkposting before the pod.
  Swagger__Enabled: "true"
  Swagger__ServerPrefix: "/rcbulkposting"

extraEnv: []

envFrom: []
  # - secretRef:
  #     name: pdl-rcbulkposting-api-secrets

dataProtection:
  enabled: true
  # Non-root container user is app ($APP_UID); keys must live under /home/app, not /root.
  mountPath: /home/app/.aspnet/DataProtection-Keys

ingress:
  enabled: false
  className: "gce"
  annotations:
    kubernetes.io/ingress.class: "gce"
    # networking.gke.io/managed-certificates: "pdl-rcbulkposting-api-cert"
    # kubernetes.io/ingress.global-static-ip-name: "pdl-rcbulkposting-api-ip"
  hosts:
    - host: rcbulkposting-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Status does not touch the database. The posting job itself runs inside the process every 2 hours.
startupProbe:
  httpGet:
    path: /api/RCPost/status
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /api/RCPost/status
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/RCPost/status
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Keep a single replica. Each pod runs the 2-hour RC posting loop, so extra replicas would post the same batch.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}