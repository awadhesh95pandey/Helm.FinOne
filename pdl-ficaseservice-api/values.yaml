replicaCount: 1

image:
  repository: ghcr.io/paisalo-digital-limited/pdl-ficaseservice-api
  pullPolicy: IfNotPresent
  digest: "sha256:1ce4a5e7dbce39acdbb21d6a623d393aeebd1302ca9d9904a760a5b034302cf0"
  tag: ""

imagePullSecrets:
  - name: nbfc-ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

containerPort: 8080

env:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: "http://+:8080"
  # Container clock and DateTime.Now use India Standard Time. JWT exp is still validated in UTC.
  TZ: "Asia/Kolkata"
  DB_TimeZone: "Asia/Kolkata"
  isliveDb: "true"
  isCrifCheckLive: "true"
  PodUrl: ""

  # This API reads the PostgreSQL login from DB_User and DB_Password, not Credntials:username.
  Credntials__HostIp: "10.247.161.3"
  Credntials__Port: "5432"
  Credntials__dbName: "pdlerp_prod"
  DB_User: "paisalo_production"
  DB_Password: "PaisaloProduction2026#!"

  # Production SFTP. This API prefers SftpPort, and also reads port.
  SftpHost: "124.123.16.234"
  SftpUsername: "Sftp"
  SftpPassword: "Sft@43^fw"
  SftpPort: "1024"
  port: "1024"
  NetworkPath: "\\\\124.123.16.234\\Data"
  NewBaseUrl: "https://predemoapi.paisalo.in:2383/Data"
  NewBaseUrl2: "https://predemoapi.paisalo.in:2383"
  # Enable Swagger UI behind Kong (https://api.paisalo.net/ficaseservice/swagger)
  Swagger__Enabled: "true"
  # Prefix used by Swagger "Try it out" so calls hit Kong: /ficaseservice/api/{controller}/{action}
  Swagger__ServerPrefix: "/ficaseservice"
  # Shared PDF generation via the Master API in prod-erp-services.
  MasterPdfUrl: "http://pdl-master-api.prod-erp-services.svc.cluster.local:8080"
  # Must match Master env PdfApiKey (store in shared secret long-term)
  PdfApiKey: "pdl-internal-pdf-key"

extraEnv: []

dataProtection:
  enabled: true
  mountPath: /root/.aspnet/DataProtection-Keys

ingress:
  enabled: false
  className: "gce"
  annotations:
    kubernetes.io/ingress.class: "gce"
    # networking.gke.io/managed-certificates: "pdl-ficaseservice-api-cert"
    # kubernetes.io/ingress.global-static-ip-name: "pdl-ficaseservice-api-ip"
  hosts:
    - host: ficaseservice-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

# Liveness and startup only prove the process is listening.
# Readiness opens PostgreSQL and runs SELECT 1. Keep this timeout above the 8s connection timeout.
startupProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
