replicaCount: 1

image:
  repository: ghcr.io/paisalo-digital-limited/pdl-accountaggregator-api
  pullPolicy: IfNotPresent
  digest: "sha256:831fc319889427b35d7bea921a14a4b9bdd971ba334d13ef2044323b0a9544d3"
  tag: ""

imagePullSecrets:
  - name: nbfc-ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

containerPort: 8080

env:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: "http://+:8080"
  # Override on-prem IP baked into appsettings.json — must be reachable from GKE (via VPN/Interconnect)
  DB_IP: "192.168.1.55"
  isliveDb: "false"
  # Enable Swagger UI behind Kong (https://api.paisalo.net/accountaggregator/swagger) when app supports it
  Swagger__Enabled: "true"
  # Prefix used by Swagger "Try it out" so calls hit Kong route /accountaggregator/...
  Swagger__ServerPrefix: "/accountaggregator"

extraEnv: []

envFrom: []
  # - secretRef:
  #     name: pdl-accountaggregator-api-secrets

dataProtection:
  enabled: true
  mountPath: /root/.aspnet/DataProtection-Keys

ingress:
  enabled: false
  className: "gce"
  annotations:
    kubernetes.io/ingress.class: "gce"
    # networking.gke.io/managed-certificates: "pdl-accountaggregator-api-cert"
    # kubernetes.io/ingress.global-static-ip-name: "pdl-accountaggregator-api-ip"
  hosts:
    - host: accountaggregator-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# App does not expose /health yet — TCP probes keep the pod ready without HTTP health routes.
# Switch to httpGet /health (like master/hrms) once health endpoints are added.
startupProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 30

livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
